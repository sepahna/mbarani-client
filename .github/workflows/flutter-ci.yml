name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows runner
        working-directory: apps/client
        run: flutter create --platforms=windows --project-name=mbarani_client .
      - name: Resolve dependencies
        working-directory: apps/client
        run: flutter pub get
      - name: Analyze
        working-directory: apps/client
        run: flutter analyze
      - name: Widget tests
        working-directory: apps/client
        run: flutter test
      - name: Build Windows
        working-directory: apps/client
        run: flutter build windows --release
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: mbarani-windows-release
          path: apps/client/build/windows/x64/runner/Release/
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android runner
        working-directory: apps/client
        run: flutter create --platforms=android --project-name=mbarani_client .
      - name: Resolve dependencies
        working-directory: apps/client
        run: flutter pub get
      - name: Analyze
        working-directory: apps/client
        run: flutter analyze
      - name: Widget tests
        working-directory: apps/client
        run: flutter test
      - name: Build Android APK
        working-directory: apps/client
        run: flutter build apk --release
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: mbarani-android-apk
          path: apps/client/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
